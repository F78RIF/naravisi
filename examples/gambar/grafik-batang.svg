<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340">
  <!-- Contoh grafik batang buatan sendiri. DATA TIRUAN, bukan data nyata. -->
  <rect width="560" height="340" fill="#fcfcfb"/>
  <text x="24" y="34" font-family="sans-serif" font-size="18" fill="#0b0b0b">Contoh: pengunjung perpustakaan per bulan (data tiruan)</text>
  <g stroke="#e2e1dc" stroke-width="1">
    <line x1="60" y1="80" x2="540" y2="80"/><line x1="60" y1="140" x2="540" y2="140"/>
    <line x1="60" y1="200" x2="540" y2="200"/><line x1="60" y1="260" x2="540" y2="260"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#52514e" text-anchor="end">
    <text x="52" y="84">300</text><text x="52" y="144">200</text><text x="52" y="204">100</text><text x="52" y="264">0</text>
  </g>
  <g fill="#2a78d6">
    <rect x="90" y="200" width="44" height="60" rx="4"/>
    <rect x="170" y="170" width="44" height="90" rx="4"/>
    <rect x="250" y="146" width="44" height="114" rx="4"/>
    <rect x="330" y="128" width="44" height="132" rx="4"/>
    <rect x="410" y="104" width="44" height="156" rx="4"/>
    <rect x="490" y="86" width="44" height="174" rx="4"/>
  </g>
  <line x1="60" y1="260" x2="540" y2="260" stroke="#52514e" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="13" fill="#52514e" text-anchor="middle">
    <text x="112" y="282">Jan</text><text x="192" y="282">Feb</text><text x="272" y="282">Mar</text>
    <text x="352" y="282">Apr</text><text x="432" y="282">Mei</text><text x="512" y="282">Jun</text>
  </g>
  <text x="512" y="78" font-family="sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle">290</text>
  <text x="24" y="320" font-family="sans-serif" font-size="13" fill="#52514e">Jumlah pengunjung naik setiap bulan, dari 100 pada Januari menjadi 290 pada Juni.</text>
</svg>
